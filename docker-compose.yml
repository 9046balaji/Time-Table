services:
  postgres:
    image: postgres:16-alpine
    container_name: vfstr_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timetable_db}
      POSTGRES_USER: ${POSTGRES_USER:-vfstr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No host port binding: only reachable via the internal Docker network (zero-trust).
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vfstr} -d ${POSTGRES_DB:-timetable_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vfstr_redis
    restart: always
    # No host port binding: only reachable via the internal Docker network (zero-trust).
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vfstr_backend
    restart: always
    # No host port binding: all traffic must ingress through nginx on port 80 (single zero-trust entrypoint).
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    volumes:
      - ./time_table:/app/time_table:ro
      - ./data:/app/data:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vfstr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-timetable_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vfstr_celery_worker
    restart: always
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    volumes:
      - ./time_table:/app/time_table:ro
      - ./data:/app/data:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vfstr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-timetable_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.tasks.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vfstr_frontend
    restart: always
    # No host port binding: all traffic must ingress through nginx on port 80 (single zero-trust entrypoint).
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    environment:
      # Relative paths so the browser calls the same-origin nginx gateway instead of bypassing it.
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/api
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: vfstr_nginx
    restart: always
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=50m
      - /var/run:rw,noexec,nosuid,size=10m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres_data:

