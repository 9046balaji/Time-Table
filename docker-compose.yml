services:
  postgres:
    image: postgres:16-alpine
    container_name: vfstr_postgres
    restart: always
    environment:
      POSTGRES_DB: timetable_db
      POSTGRES_USER: vfstr
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vfstr_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vfstr_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./time_table:/app/time_table:ro
      - ./data:/app/data:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://vfstr:password@postgres:5432/timetable_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vfstr_celery_worker
    restart: always
    command: celery -A backend.tasks.celery_app worker --loglevel=info
    volumes:
      - ./time_table:/app/time_table:ro
      - ./data:/app/data:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://vfstr:password@postgres:5432/timetable_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - postgres
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vfstr_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
