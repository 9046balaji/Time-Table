version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vfstr_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfstr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureProductionPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-timetable_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vfstr} -d ${POSTGRES_DB:-timetable_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    networks:
      - internal_network

  redis:
    image: redis:7.4-alpine
    container_name: vfstr_redis_prod
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-RedisSecurePass2026!}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - internal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vfstr_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vfstr}:${POSTGRES_PASSWORD:-SecureProductionPassword2026!}@postgres:5432/${POSTGRES_DB:-timetable_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    networks:
      - internal_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vfstr_celery_prod
    restart: always
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vfstr}:${POSTGRES_PASSWORD:-SecureProductionPassword2026!}@postgres:5432/${POSTGRES_DB:-timetable_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    networks:
      - internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vfstr_frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://timetable.vignan.ac.in
      NEXT_PUBLIC_WS_URL: wss://timetable.vignan.ac.in
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - internal_network

  nginx:
    image: nginx:1.25-alpine
    container_name: vfstr_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal_network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  internal_network:
    driver: bridge
