# Production Nginx Configuration — VFSTR Timetable Scheduler Platform
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format production_json '{"time": "$time_iso8601", '
                                '"remote_addr": "$remote_addr", '
                                '"request": "$request", '
                                '"status": "$status", '
                                '"body_bytes_sent": "$body_bytes_sent", '
                                '"request_time": "$request_time", '
                                '"http_referrer": "$http_referer", '
                                '"http_user_agent": "$http_user_agent"}';

    access_log /var/log/nginx/access.log production_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zones (DoS Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=solver_limit:10m rate=1r/m;
    limit_req_status 429;

    # Docker Internal DNS Resolver for Dynamic Upstream Resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Upstream Services
    upstream frontend_server {
        server frontend:3000 max_fails=5 fail_timeout=5s;
        keepalive 32;
    }

    upstream backend_server {
        server backend:8000 max_fails=5 fail_timeout=5s;
        keepalive 32;
    }

    # Primary Gateway Server (Port 80 HTTP / Proxy Gateway)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 15M;

        # HTTP Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Next.js Frontend App Proxy
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Heavy CP-SAT Solver API Route (Strict Rate Limiting)
        location /api/v1/solve/ {
            limit_req zone=solver_limit burst=2 nodelay;
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # General FastAPI Backend Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # Production HTTPS SSL Server (Uncomment after running certbot to issue certificates)
